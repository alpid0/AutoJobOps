name: AutoJobOps - Job Search

'on':
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'

permissions:
  contents: write

jobs:
  job-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch and Match Jobs
        run: python src/job_fetcher.py

      - name: Save Job Database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Update job database"
          git push
