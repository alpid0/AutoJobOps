name: AutoJobOps - Job Search

'on':
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  job-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch Real Jobs
        run: python src/job_fetcher.py

      - name: Run Job Matcher
        run: python src/job_matcher.py
